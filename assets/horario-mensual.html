<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario de Oración — Mezquita Arrahma</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a87c2b;
            --primary-light: #fdf6e8;
            --tertiary: #0f4c3a;
            --surface: #faf9f7;
            --text: #1a1a1a;
            --text-muted: #666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--surface);
            color: var(--text);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 24px;
            border-bottom: 3px solid var(--primary);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .header .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 1px;
        }

        .header .month-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--tertiary);
            margin-top: 12px;
            text-transform: capitalize;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-today { background: var(--tertiary); }
        .dot-normal { background: var(--primary-light); border: 1px solid #ccc; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead th {
            background: var(--primary);
            color: white;
            padding: 10px 6px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        thead th:first-child {
            border-radius: 8px 0 0 0;
            text-align: left;
            padding-left: 14px;
        }

        thead th:last-child {
            border-radius: 0 8px 0 0;
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:nth-child(even) {
            background: rgba(168, 124, 43, 0.04);
        }

        tbody tr:hover {
            background: rgba(168, 124, 43, 0.1);
        }

        tbody tr.today-row {
            background: rgba(15, 76, 58, 0.1) !important;
            font-weight: 700;
        }

        tbody tr.today-row td:first-child {
            position: relative;
        }

        tbody tr.today-row td:first-child::before {
            content: '►';
            position: absolute;
            left: 2px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tertiary);
            font-size: 9px;
        }

        td {
            padding: 9px 6px;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        td:first-child {
            text-align: left;
            padding-left: 18px;
            font-weight: 600;
            color: var(--primary);
            min-width: 50px;
        }

        .footer {
            text-align: center;
            padding: 24px 20px;
            margin-top: 24px;
            border-top: 2px solid rgba(168, 124, 43, 0.2);
            color: var(--text-muted);
            font-size: 12px;
        }

        .footer strong {
            color: var(--primary);
        }

        .print-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 24px;
            padding: 12px 28px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s;
        }

        .print-btn:hover {
            background: #8a6522;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(168, 124, 43, 0.3);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .header h1 { font-size: 20px; }
            .header .month-name { font-size: 18px; }
            table { font-size: 11px; }
            thead th { padding: 8px 3px; font-size: 9px; letter-spacing: 0.8px; }
            td { padding: 7px 3px; }
            td:first-child { padding-left: 10px; min-width: 35px; }
        }

        @media print {
            .print-btn, .back-link { display: none !important; }
            body { padding: 0; }
            thead th { position: static; }
            .header { padding: 15px 10px; margin-bottom: 10px; }
            .footer { padding: 10px; margin-top: 10px; }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Volver a la web</a>

    <div class="header">
        <h1>Mezquita Arrahma</h1>
        <div class="subtitle">Palma de Mallorca — Horarios de Oración</div>
        <div class="month-name" id="month-name"></div>
    </div>

    <button class="print-btn" onclick="window.print()">
        🖨️ Imprimir / Guardar PDF
    </button>

    <div class="legend">
        <span><span class="dot dot-today"></span> Hoy</span>
        <span><span class="dot dot-normal"></span> Otros días</span>
    </div>

    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>Día</th>
                    <th>Fajr</th>
                    <th>Shuruq</th>
                    <th>Dhuhr</th>
                    <th>Asr</th>
                    <th>Maghrib</th>
                    <th>Isha</th>
                </tr>
            </thead>
            <tbody id="schedule-body"></tbody>
        </table>
    </div>

    <div class="footer">
        Fuente: <strong>Mawaqit</strong> — mawaqit.net<br>
        Los horarios pueden variar ligeramente. Consulte siempre con la mezquita.
    </div>

        const DAY_NAMES = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

        function renderSchedule() {
            const now = new Date();
            const month = now.getMonth();
            const today = now.getDate();
            const year = now.getFullYear();
            const monthData = MAWAQIT_CALENDAR[month];

            document.getElementById('month-name').textContent =
                MONTH_NAMES[month] + ' ' + year;

            const tbody = document.getElementById('schedule-body');
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let html = '';
            for (let day = 1; day <= daysInMonth; day++) {
                const times = monthData[day.toString()];
                if (!times) continue;

                const dateObj = new Date(year, month, day);
                const dayName = DAY_NAMES[dateObj.getDay()];
                const isToday = day === today;

                html += `<tr class="${isToday ? 'today-row' : ''}">`;
                html += `<td>${dayName} ${day}</td>`;
                times.forEach(t => { html += `<td>${t}</td>`; });
                html += `</tr>`;
            }

            tbody.innerHTML = html;
        }

        renderSchedule();
